      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - name: Create project files
        run: |
          mkdir -p app/src/main/java/com/aesthetic/launcher app/src/main/res/layout app/src/main/res/xml app/src/main/res/values app/src/main/res/drawable app/src/main/res/drawable-nodpi
          cat > settings.gradle.kts <<'EOF_FILE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "AestheticLauncher"
          include(":app")
          EOF_FILE
          cat > build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.20" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.20" apply false
          }
          EOF_FILE
          cat > gradle.properties <<'EOF_FILE'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF_FILE
          cat > app/build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
