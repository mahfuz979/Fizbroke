                  android:layout_gravity="top|start"
                  android:layout_margin="10dp"
                  android:format12Hour="hh:mm"
                  android:format24Hour="HH:mm"
                  android:textColor="#FFFFFF"
                  android:textSize="30sp"
                  android:fontFamily="sans-serif-light"
                  android:shadowColor="#99000000"
                  android:shadowRadius="6" />
          </FrameLayout>
          EOF_FILE
          base64 -d > app/src/main/res/drawable-nodpi/ic_launcher.png <<'EOF_FILE'
          iVBORw0KGgoAAAANSUhEUgAAAIAAAACACAMAAAD04JH5AAAAkFBMVEWcJyvRIiXsaWqXmJxnIyW9wc1vcHMpFhd6e4O3u8f3kpL3
          zs+kS0w8PUB+gYvCP0MCAAD2AgX5+PotAABOAQCvAQHPAQJuAQHo6O2NAQHX2uPHytX5FBr5Jyz5R0rQ09z7VVf5Njr6HCIoJyhW
