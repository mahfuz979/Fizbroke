          EOF_FILE
          cat > app/src/main/res/drawable/ic_logo.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="128dp" android:height="128dp"
              android:viewportWidth="100" android:viewportHeight="100">
              <path android:fillColor="#000000"
                  android:pathData="M22,0h56a22,22 0 0 1 22,22v56a22,22 0 0 1 -22,22h-56a22,22 0 0 1 -22,-22v-56a22,22 0 0 1 22,-22z" />
              <path android:strokeColor="#FFFFFF" android:strokeWidth="13"
                  android:pathData="M28,52a22,22 0 1,0 44,0a22,22 0 1,0 -44,0" />
              <path android:strokeColor="#FF1F1F" android:strokeWidth="7" android:strokeLineCap="round"
                  android:pathData="M12,66 Q54,58 90,30" />
              <path android:strokeColor="#FF1F1F" android:strokeWidth="4" android:strokeLineCap="round"
                  android:pathData="M10,40h12 M6,50h14 M12,60h10" />
