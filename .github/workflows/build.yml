          EOF_FILE
          cat > app/src/main/res/drawable/widget_bg.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
